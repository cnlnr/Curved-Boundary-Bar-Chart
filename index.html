<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲界线柱状图 (Curved-Boundary Bar Chart)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --sub: #8b949e; --blue: #58a6ff; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
    .header { text-align: center; margin-bottom: 14px; }
    .header h1 { margin: 0 0 6px 0; font-size: 1.45rem; color: #f0f6fc; letter-spacing: 0.5px; }
    .github-link { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); text-decoration: none; font-size: 0.85rem; font-family: monospace; background: rgba(88, 166, 255, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(88, 166, 255, 0.25); transition: 0.2s; }
    .github-link:hover { background: rgba(88, 166, 255, 0.2); }
    .box { width: 720px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; box-sizing: border-box; }
    .chart-container { position: relative; width: 100%; height: 420px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; background: var(--bg); padding: 14px; border-radius: 6px; border: 1px solid var(--border); }
    .controls label { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
    .status-bar { grid-column: span 2; display: flex; justify-content: space-between; padding: 10px 14px; border-left: 4px solid var(--blue); background: var(--card); border-radius: 4px; font-weight: 600; font-family: monospace; }
  </style>
</head>
<body>

  <!-- 顶部标题与开源项目链接 -->
  <div class="header">
    <h1>曲界线柱状图 (Curved-Boundary Bar Chart)</h1>
    <a class="github-link" href="https://github.com/cnlnr/Curved-Boundary-Bar-Chart" target="_blank" rel="noopener noreferrer">
      <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      https://github.com/cnlnr/Curved-Boundary-Bar-Chart
    </a>
  </div>

  <div class="box">
    <div class="chart-container">
      <canvas id="mainChart"></canvas>
    </div>
    <div class="controls">
      <div>
        <label>压强 (P) <span id="pVal">1.00 atm</span></label>
        <input type="range" id="sliderP" min="0.01" max="10" step="0.01" value="1.00" style="width: 100%;">
      </div>
      <div>
        <label>温度 (T) <span id="tVal">25 °C</span></label>
        <input type="range" id="sliderT" min="-50" max="450" step="1" value="25" style="width: 100%;">
      </div>
      <div class="status-bar" id="statusCard">
        <span style="color:#8b949e">水的状态</span>
        <span id="phaseStatus">液态 (Liquid)</span>
      </div>
    </div>
  </div>

  <script>
    const TP = { p: 0.8, t: 0.01 }, CP = { p: 7.5, t: 374 };
    const PHASES = {
      SOLID: { name: '固态 (Solid)', color: '#38bdf8' },
      LIQUID: { name: '液态 (Liquid)', color: '#3b82f6' },
      GAS: { name: '气态 (Gas)', color: '#f59e0b' },
      SUPERCRITICAL: { name: '超临界流体 (Supercritical)', color: '#bc8cff' }
    };

    // 1. 生成平滑相变分界线数据点
    const subPts = Array.from({ length: 40 }, (_, i) => {
      const p = (i / 39) * TP.p;
      return { x: p, y: -50 + (TP.t - (-50)) * Math.pow(p / TP.p, 0.6) };
    });

    const meltPts = Array.from({ length: 40 }, (_, i) => {
      const p = TP.p + (i / 39) * (10 - TP.p);
      return { x: p, y: TP.t - 3.5 * Math.log(p / TP.p + 1) };
    });

    const vapPts = Array.from({ length: 60 }, (_, i) => {
      const p = TP.p + (i / 59) * (CP.p - TP.p);
      return { x: p, y: TP.t + (CP.t - TP.t) * Math.pow((p - TP.p) / (CP.p - TP.p), 0.45) };
    });

    function getPhase(p, t) {
      if (p >= CP.p && t >= CP.t) return PHASES.SUPERCRITICAL;
      if (p < TP.p) {
        const subT = -50 + (TP.t - (-50)) * Math.pow(p / TP.p, 0.6);
        return t < subT ? PHASES.SOLID : PHASES.GAS;
      }
      const meltT = TP.t - 3.5 * Math.log(p / TP.p + 1);
      if (t < meltT) return PHASES.SOLID;
      if (p <= CP.p) {
        const vapT = TP.t + (CP.t - TP.t) * Math.pow((p - TP.p) / (CP.p - TP.p), 0.45);
        return t < vapT ? PHASES.LIQUID : PHASES.GAS;
      }
      return PHASES.LIQUID;
    }

    // 2. 自定义相图渲染插件（底层绘色块 + 顶层标注关键点与彩色柱体状态）
    const phaseDiagramPlugin = {
      id: 'phaseDiagramPlugin',
      beforeDraw(chart) {
        const { ctx, chartArea, scales: { x, y } } = chart;
        if (!chartArea) return;
        ctx.save();

        const xPx = val => x.getPixelForValue(val);
        const yPx = val => y.getPixelForValue(val);

        // --- A. 气态区域 ---
        ctx.fillStyle = 'rgba(245, 158, 11, 0.22)';
        ctx.beginPath();
        ctx.moveTo(xPx(0), yPx(-50));
        subPts.forEach(pt => ctx.lineTo(xPx(pt.x), yPx(pt.y)));
        vapPts.forEach(pt => ctx.lineTo(xPx(pt.x), yPx(pt.y)));
        ctx.lineTo(xPx(CP.p), yPx(450));
        ctx.lineTo(xPx(0), yPx(450));
        ctx.closePath();
        ctx.fill();

        // --- B. 液态区域 ---
        ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
        ctx.beginPath();
        meltPts.forEach((pt, i) => i === 0 ? ctx.moveTo(xPx(pt.x), yPx(pt.y)) : ctx.lineTo(xPx(pt.x), yPx(pt.y)));
        ctx.lineTo(xPx(10), yPx(CP.t));
        ctx.lineTo(xPx(CP.p), yPx(CP.t));
        for (let i = vapPts.length - 1; i >= 0; i--) {
          ctx.lineTo(xPx(vapPts[i].x), yPx(vapPts[i].y));
        }
        ctx.closePath();
        ctx.fill();

        // --- C. 固态区域 ---
        ctx.fillStyle = 'rgba(56, 189, 248, 0.26)';
        ctx.beginPath();
        ctx.moveTo(xPx(0), yPx(-50));
        subPts.forEach(pt => ctx.lineTo(xPx(pt.x), yPx(pt.y)));
        meltPts.forEach(pt => ctx.lineTo(xPx(pt.x), yPx(pt.y)));
        ctx.lineTo(xPx(10), yPx(-50));
        ctx.closePath();
        ctx.fill();

        // --- D. 超临界流体区域 ---
        ctx.fillStyle = 'rgba(188, 140, 255, 0.22)';
        ctx.beginPath();
        ctx.moveTo(xPx(CP.p), yPx(CP.t));
        ctx.lineTo(xPx(10), yPx(CP.t));
        ctx.lineTo(xPx(10), yPx(450));
        ctx.lineTo(xPx(CP.p), yPx(450));
        ctx.closePath();
        ctx.fill();

        // --- E. 超临界分界虚线 ---
        ctx.strokeStyle = 'rgba(188, 140, 255, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(xPx(CP.p), yPx(CP.t));
        ctx.lineTo(xPx(CP.p), yPx(450));
        ctx.moveTo(xPx(CP.p), yPx(CP.t));
        ctx.lineTo(xPx(10), yPx(CP.t));
        ctx.stroke();

        ctx.restore();
      },
      afterDatasetsDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        ctx.save();
        ctx.font = '600 12px -apple-system, system-ui, sans-serif';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 4;

        // 1. 标注三相点
        const tpX = x.getPixelForValue(TP.p);
        const tpY = y.getPixelForValue(TP.t);
        ctx.fillStyle = '#ff7b72';
        ctx.textAlign = 'left';
        ctx.fillText('三相点 (Triple Point)', tpX + 8, tpY - 6);

        // 2. 标注右上角临界点
        const cpX = x.getPixelForValue(CP.p);
        const cpY = y.getPixelForValue(CP.t);
        ctx.fillStyle = '#d2a8ff';
        ctx.textAlign = 'right';
        ctx.fillText('临界点 (Critical Point)', cpX - 8, cpY - 8);

        // 3. 在柱体顶端标注彩色文字：XX°C (物相)
        const barDataset = chart.data.datasets[4];
        if (barDataset && barDataset.data && barDataset.data.length > 1) {
          const topPoint = barDataset.data[1];
          const curP = topPoint.x;
          const curT = topPoint.y;
          const phase = getPhase(curP, curT);

          const barX = x.getPixelForValue(curP);
          const barY = y.getPixelForValue(curT);

          const shortState = phase.name.split(' ')[0];

          ctx.textAlign = 'center';
          // 关键变动：动态绑定物相主题色，赋予文本鲜明色彩
          ctx.fillStyle = phase.color;
          ctx.font = '700 12px ui-monospace, SFMono-Regular, Menlo, monospace';
          ctx.fillText(`${curT.toFixed(0)}°C (${shortState})`, barX, barY - 10);
        }

        ctx.restore();
      }
    };

    const ctx = document.getElementById('mainChart').getContext('2d');
    const myChart = new Chart(ctx, {
      type: 'scatter',
      plugins: [phaseDiagramPlugin],
      data: {
        datasets: [
          // 升华线 (虚线)
          {
            type: 'line', data: subPts, borderColor: '#38bdf8', borderWidth: 2,
            borderDash: [4, 4], pointRadius: 0, tension: 0.35, showLine: true
          },
          // 熔点线
          {
            type: 'line', data: meltPts, borderColor: '#3fb950', borderWidth: 2,
            pointRadius: 0, tension: 0.2, showLine: true
          },
          // 汽化线
          {
            type: 'line', data: vapPts, borderColor: '#f59e0b', borderWidth: 2.2,
            pointRadius: 0, tension: 0.35, showLine: true
          },
          // 三相点与临界点圆点
          {
            type: 'scatter',
            data: [{ x: TP.p, y: TP.t }, { x: CP.p, y: CP.t }],
            backgroundColor: ['#f85149', '#bc8cff'],
            borderColor: '#0d1117',
            borderWidth: 1.5,
            pointRadius: 4,
            pointHoverRadius: 4
          },
          // 核心发明：曲界线柱状体（圆点保持精致 2.5px）
          {
            type: 'line',
            data: [{ x: 1.0, y: -50 }, { x: 1.0, y: 25 }],
            borderColor: '#3b82f6',
            borderWidth: 14,
            pointRadius: [0, 2.5],
            pointBackgroundColor: '#ffffff',
            pointBorderColor: '#3b82f6',
            pointBorderWidth: 1,
            showLine: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false }
        },
        scales: {
          x: {
            type: 'linear', min: 0, max: 10,
            title: { display: true, text: '压强 P (atm)', color: '#8b949e', font: { size: 12 } },
            grid: { color: 'rgba(255, 255, 255, 0.06)' }, ticks: { color: '#8b949e', stepSize: 2 }
          },
          y: {
            type: 'linear', min: -50, max: 450,
            title: { display: true, text: '温度 T (°C)', color: '#8b949e', font: { size: 12 } },
            grid: { color: 'rgba(255, 255, 255, 0.06)' }, ticks: { color: '#8b949e', stepSize: 100 }
          }
        }
      }
    });

    function update(p, t) {
      const phase = getPhase(p, t);

      // 更新柱体（第 4 个数据集）
      const barDataset = myChart.data.datasets[4];
      barDataset.data = [{ x: p, y: -50 }, { x: p, y: t }];
      barDataset.borderColor = phase.color + 'dd';
      barDataset.pointBorderColor = phase.color;
      myChart.update('none');

      // 同步下方状态条
      document.getElementById('pVal').textContent = p.toFixed(2) + ' atm';
      document.getElementById('tVal').textContent = t.toFixed(0) + ' °C';
      const status = document.getElementById('phaseStatus');
      status.textContent = phase.name;
      status.style.color = phase.color;
      document.getElementById('statusCard').style.borderLeftColor = phase.color;
    }

    const sliderP = document.getElementById('sliderP');
    const sliderT = document.getElementById('sliderT');
    const sync = () => update(parseFloat(sliderP.value), parseFloat(sliderT.value));
    sliderP.oninput = sync;
    sliderT.oninput = sync;
    sync();
  </script>
</body>
</html>
